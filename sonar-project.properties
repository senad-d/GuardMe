sonar.projectKey=senad-d_GuardMe
sonar.organization=senad-d

# Keep analysis focused on source assets while still scanning helper scripts and workflows.
sonar.sources=src,scripts,.github/workflows
sonar.tests=test
sonar.test.inclusions=test/**/*.test.mjs,test/e2e/**/*.mjs,test/e2e/**/*.ts

# `npm run coverage` writes this before the SonarQube GitHub Action runs.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=scripts/**,.github/**

# S5443 flags literal public-temp paths even when they are only policy patterns.
# Limit the exception to declarative data: no filesystem I/O belongs in this file.
# All other rules still apply there, and S5443 remains enabled for executable code.
sonar.issue.ignore.multicriteria=osTempPolicyPatterns
sonar.issue.ignore.multicriteria.osTempPolicyPatterns.ruleKey=typescript:S5443
sonar.issue.ignore.multicriteria.osTempPolicyPatterns.resourceKey=src/config/os-temp-patterns.ts

sonar.sourceEncoding=UTF-8
